version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # NOTE: Local Redis is optional. 
  # Upstash Redis is used in config.py, but for completely offline local dev, uncomment below:
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
