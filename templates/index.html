<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomass Valuation Engine</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        .upload-container { background-color: white; padding: 40px; margin: 0 auto; width: 50%; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input[type="file"], input[type="number"] { margin-bottom: 20px; padding: 10px; }
        .btn { padding: 12px 24px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    
    <h1>Agri-Waste Biomass Valuation Engine</h1>
    
    <div class="upload-container">
        <h3>Upload Farm Stubble Image</h3>
        
        <form action="/detect" method="POST" enctype="multipart/form-data">
            
            <div style="margin-bottom: 25px;">
                <label for="farm_area" style="font-size: 1.1em;"><strong>Farm Area (in Hectares): </strong></label><br><br>
                <input type="number" id="farm_area" name="farm_area" step="0.1" value="1.0" required style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 120px; text-align: center; font-size: 1.1em;">
            </div>
            
            <div style="margin-bottom: 30px;">
                <input type="file" name="crop_image" accept="image/*" required style="font-size: 1em;">
            </div>

            <button type="submit" class="btn">Analyze Biomass & Calculate Metrics</button>
        </form>
    </div>

</body>
</html>
